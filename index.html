<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>The Sultan's Dubious Kebab Shop</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #1a120c; }
    .stage { position: relative; width: min(100vw, 520px); margin: 0 auto; container-type: inline-size; }
    .stage img.art { width: 100%; height: auto; display: block; }
    .speech {
      position: absolute;
      left: 21.5%;
      top: 78.4%;
      width: 54%;
      height: 7.6%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4%;
      overflow: hidden;
      background: #f3d4a8 url("parchment.jpg") center / cover no-repeat;
      color: #2a1608;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 4.1cqw;
      line-height: 1.15;
      text-align: center;
    }
    .hit {
      position: absolute;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: transparent;
      font-size: 0;
      cursor: pointer;
    }
    .hit:focus-visible,
    .hit[aria-pressed="true"] {
      outline: 3px solid #f0d78c;
      outline-offset: -8px;
    }
    .hit:disabled { cursor: default; }
    #falawful { left: 5%; top: 89%; width: 22%; height: 7%; }
    #chicken { left: 29%; top: 89%; width: 22%; height: 7%; }
    #beef { left: 53.4%; top: 89%; width: 22%; height: 7%; }
    #next { left: 78%; top: 79.2%; width: 17.6%; height: 16.8%; }
  </style>
</head>
<body>
  <main class="stage">
    <img class="art" src="image-one.jpg" alt="The Sultan's Dubious Kebab Shop">
    <p class="speech" id="speech" aria-live="polite"></p>
    <button class="hit" type="button" id="falawful" aria-pressed="false">Falawful Kebab</button>
    <button class="hit" type="button" id="chicken" aria-pressed="false">Chicken Kebab</button>
    <button class="hit" type="button" id="beef" aria-pressed="false">Beef Kebab</button>
    <button class="hit" type="button" id="next" disabled>Next Customer</button>
  </main>
  <script src="game.js"></script>
  <script>
    let state = Sultan.createShift();
    const speech = document.getElementById("speech");
    const dishes = ["falawful", "chicken", "beef"].map(function (id) { return document.getElementById(id); });
    const next = document.getElementById("next");

    function draw() {
      speech.textContent = Sultan.speech(state);
      dishes.forEach(function (button) {
        const chosen = state.served === button.id;
        button.setAttribute("aria-pressed", chosen ? "true" : "false");
        button.disabled = Boolean(state.served) || state.done;
      });
      next.disabled = !state.served || state.done;
      if (state.done) next.setAttribute("aria-pressed", "true");
    }

    dishes.forEach(function (button) {
      button.addEventListener("click", function () {
        state = Sultan.choose(state, button.id);
        draw();
      });
    });
    next.addEventListener("click", function () {
      state = Sultan.nextCustomer(state);
      draw();
    });
    draw();
  </script>
</body>
</html>
